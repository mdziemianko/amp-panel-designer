name: "Big muff"
width: 70mm
height: 126mm
background_color: "#ffffff"
render_mode: "drill_mask"

elements:
  - type: group
    id: "controls"
    x: 5mm
    y: 5mm
    width: 60mm
    height: 116mm
    label: 
      text: "Big Muff"
      position: "bottom-inside"
      font:
        size: "25pt"
        family: "copperplate"
    border:
      type: full
      thickness: 0.5mm
      color: "#000000"
    elements:
      - type: potentiometer
        id: "mid"
        x: 12mm
        y: 14mm
        label:
          text: "MID"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"


      - type: potentiometer
        id: "tone"
        x: 48mm
        y: 14mm
        label:
          text: "TONE"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"
        
      - type: potentiometer
        id: "volume"
        x: 12mm
        y: 44mm
        label:
          text: "LEVEL"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"

      - type: potentiometer
        id: "sustain"
        x: 48mm
        y: 44mm
        label:
          text: "SUSTAIN"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"

      - type: custom
        id: "power_led"
        x: "30mm"
        y: "67mm"
        mount:
          diameter: "5mm"

      - type: custom
        id: "switch"
        x: "30mm"
        y: "89mm"
        mount:
          diameter: "12mm"

  

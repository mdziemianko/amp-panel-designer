# Chord definitions for the slider panel generator.
#
# Interval sequence (22 cells, 5mm × 8mm each):
#   1  b2  2  b3  3  4  b5  5  b6  6  b7  7  8  b9  9  #9  10  11  b12  12  b13  13
#
# Alternative names accepted: #5 (= b6), bb7 (= 6)
#
# col:  1–4  (panel column)
# row:  1–9  (row within column; rows are separated by an equal-height gap)
# intervals: list of interval names from the sequence above

MAJOR TRIAD:
  col: 1
  row: 1
  intervals: ["1", "3", "5"]

7 CHORD - Dominant 7:
  col: 1
  row: 2
  intervals: ["1", "3", "5", "b7"]

MAJOR 7 CHORD - Major 7 - maj7:
  col: 1
  row: 3
  intervals: ["1", "3", "5", "7"]

6 CHORD - Major 6:
  col: 1
  row: 4
  intervals: ["1", "3", "5", "6"]
  
SUSPENDED 4 CHORD - sus4:
    col: 1
    row: 5
    intervals: ["1", "4", "5"]
    
9 CHORD - 9:
  col: 1
  row: 6
  intervals: ["1", "3", "5", "b7", "9"]
  
ADD 9 CHORD - add9:
  col: 1
  row: 7
  intervals: ["1", "3", "5", "9"]
  
11 CHORD - 11:
    col: 1
    row: 8
    intervals: ["1", "5", "b7", "9", "11"]
    
13 CHORD - 13:
    col: 1
    row: 9
    intervals: ["1", "3", "5", "b7", "9", "11", "13"]
    
# ---------------------    

AUGMENTED TRIAD:
  col: 2
  row: 1
  intervals: ["1", "3", "#5"]
  
7 SHARP 5 CHORD - 7#5:
  col: 2
  row: 5
  intervals: ["1", "3", "#5", "b7"]


# ----------------------
MINOR TRIAD:
  col: 3
  row: 1
  intervals: ["1", "b3", "5"]

MINOR 7 CHORD - m7:
  col: 3
  row: 2
  intervals: ["1", "b3", "5", "b7"]

MAJOR MINOR 7 CHORD -  Mmaj7:
  col: 3
  row: 3
  intervals: ["1", "b3", "5", "7"]

MINOR 6 CHORD - m6:
  col: 3
  row: 4
  intervals: ["1", "b3", "5", "6"]
  
    
MINOR 9 CHORD - m9:
  col: 3
  row: 6
  intervals: ["1", "b3", "5", "b7", "9"]
  
MAJOR 6 ADD 9 CHORD - 6/9:
  col: 3
  row: 7
  intervals: ["1", "3", "5", "6", "9"]
  
7 SHARP 9 CHORD - 7#9:
    col: 3
    row: 8
    intervals: ["1", "3", "5", "b7", "#9"]
    
7 FLAT 9 CHORD - 7b9:
    col: 3
    row: 9
    intervals: ["1", "3", "5", "b7", "b9"]  
    
# ----------------
DIMINISHED TRIAD:
  col: 4
  row: 1
  intervals: ["1", "b3", "b5"]
  
DIMINISHED 7 CHORD - dim7:
   col: 4
   row: 2
   intervals: ["1", "b3", "b5", "bb7"]

MINOR 7 FLAT 5 CHORD - m7b5 - half dim:
   col: 4
   row: 4
   intervals: ["1", "b3", "b5", "b7"]

7 FLAT 5 CHORD - 7b5:
   col: 4
   row: 5
   intervals: ["1", "3", "b5", "b7"]
name: "Jeds 808 MAX"
width: 70mm
height: 126mm
background:
  #color: "#05AA05"
  color: "#ffffff"
  image:
    path: assets/bn.png
    source:
      x: 0.0
      y: 0.0
      width: 1.0
      height: 1.0
    source_units: normalized
    fit: cover
    zoom: 1.0
    pan:
      x: 0mm
      y: 0mm
    opacity: 0.5
    # With fit: cover, vertical align picks which part of the bitmap stays visible.
    # "top" keeps the top of the image (not the center/bottom).
    align: top
    # Raster only in the bottom half of the panel (top half stays solid green).
    placement:
      y: "50%"
      height: "50%"
      width: "100%"

render_mode: "drill_mask"

elements:
  - type: group
    id: "controls"
    x: 5mm
    y: 5mm
    width: 60mm
    height: 116mm
    label: 
      text: "Banshee"
      position: "bottom-inside"
      distance: "10mm"
      font:
        size: "35pt"
        family: "herculanum"
        color: "black"
        weight: "bold"
    border:
      type: full
      thickness: 0.5mm
      color: "black"
    elements:
      - type: potentiometer
        id: "volume"
        x: 12mm
        y: 14mm
        label:
          text: "LEVEL"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"


      - type: potentiometer
        id: "drive"
        x: 48mm
        y: 14mm
        label:
          text: "DRIVE"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"
        
      - type: potentiometer
        id: "tone"
        x: 12mm
        y: 44mm
        label:
          text: "TONE"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"

      - type: potentiometer
        id: "voice"
        x: 48mm
        y: 44mm
        label:
          text: "VOICE"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"
      
      - type: switch
        id: "clip"
        x: "30mm"
        y: "14mm"
        switch_type: "toggle"
        label: 
          text: "CLIP"
          position: "bottom"
          distance: "5mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"

      - type: switch
        id: "bright"
        x: "30mm"
        y: "27.5mm"
        switch_type: "toggle"
        label: 
          text: "BRIGHT"
          position: "bottom"
          distance: "5mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
      
      - type: switch
        id: "fat"
        x: "30mm"
        y: "41mm"
        switch_type: "toggle"
        label: 
          text: "FAT"
          position: "bottom"
          distance: "5mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"

      - type: custom
        id: "power_led"
        x: "30mm"
        y: "66mm"
        mount:
          diameter: "5mm"

      - type: custom
        id: "switch"
        x: "30mm"
        y: "90mm"
        mount:
          diameter: "12mm"

  

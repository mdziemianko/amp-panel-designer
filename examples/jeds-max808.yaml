name: "Jeds 808 MAX"
width: 70mm
height: 126mm
background:
  color: "#05AA05"

render_mode: "both"

elements:
  - type: group
    id: "controls"
    x: 5mm
    y: 5mm
    width: 60mm
    height: 116mm
    label: 
      text: "Banshee"
      position: "bottom-inside"
      distance: "10mm"
      font:
        size: "25pt"
        family: "zapfino"
        color: "black"
        weight: "bold"
    border:
      type: full
      thickness: 0.5mm
      color: "black"
    elements:
      - type: potentiometer
        id: "volume"
        x: 12mm
        y: 14mm
        label:
          text: "LEVEL"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"


      - type: potentiometer
        id: "drive"
        x: 48mm
        y: 14mm
        label:
          text: "DRIVE"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"
        
      - type: potentiometer
        id: "tone"
        x: 12mm
        y: 44mm
        label:
          text: "TONE"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"

      - type: potentiometer
        id: "voice"
        x: 48mm
        y: 44mm
        label:
          text: "VOICE"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "15mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"
      
      - type: switch
        id: "clip"
        x: "30mm"
        y: "14mm"
        switch_type: "toggle"
        label: 
          text: "CLIP"
          position: "bottom"
          distance: "5mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"

      - type: switch
        id: "bright"
        x: "30mm"
        y: "28mm"
        switch_type: "toggle"
        label: 
          text: "BRIGHT"
          position: "bottom"
          distance: "5mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
      
      - type: switch
        id: "fat"
        x: "30mm"
        y: "42mm"
        switch_type: "toggle"
        label: 
          text: "FAT"
          position: "bottom"
          distance: "5mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"

      - type: custom
        id: "power_led"
        x: "30mm"
        y: "68mm"
        mount:
          diameter: "5mm"

      - type: custom
        id: "switch"
        x: "30mm"
        y: "90mm"
        mount:
          diameter: "12mm"

  

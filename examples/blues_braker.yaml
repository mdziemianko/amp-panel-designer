name: "Blues Braker"
width: 65mm
height: 117mm
background:
  color: "#ffffff"
  image:
    path: assets/notes.png
    source:
      x: 0.0
      y: 0.0
      width: 1.0
      height: 1.0
    source_units: normalized
    fit: contain
    zoom: 0.7
    pan:
      x: 0mm
      y: 0mm
    opacity: 0.5
    # With fit: cover, vertical align picks which part of the bitmap stays visible.
    # "top" keeps the top of the image (not the center/bottom).
    align: top
    # Raster only in the bottom half of the panel (top half stays solid green).
    placement:
      y: "25%"
      height: "100%"
      width: "100%"

render_mode: "drill_mask"

elements:
  - type: group
    id: "controls"
    x: 5mm
    y: 5mm
    width: 55mm
    height: 107mm
    label: 
      # text: "Big Muff"
      text: "Blues Braker"
      position: "bottom-inside"
      font:
        size: "16pt"
        #  family: "brush script"
        family: "zapfino"
    
        # font_weight: "bold"
    border:
      type: full
      thickness: 0.5mm
      color: "#000000"
    elements:
      - type: potentiometer
        id: "mid"
        x: 9.5mm
        y: 16mm
        label:
          text: "LEVEL"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "13mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"


      - type: potentiometer
        id: "tone"
        x: 27.5mm
        y: 19mm
        label:
          text: "TONE"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "13mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"
        
      - type: potentiometer
        id: "volume"
        x: 45.5mm
        y: 16mm
        label:
          text: "GAIN"
          position: "bottom"
          distance: "10mm"
          font:
            color: "black"
            size: "10pt"
            weight: "bold"
        knob_diameter: "12mm"
        border_diameter: "13mm"
        scale:
          num_ticks: 11
          tick_size: "1mm"
          tick_style: "dot"

      
      - type: custom
        id: "power_led"
        x: "27.5mm"
        y: "53mm"
        mount:
          diameter: "5mm"

      - type: custom
        id: "switch"
        x: "27.5mm"
        y: "77mm"
        mount:
          diameter: "12mm"

  
